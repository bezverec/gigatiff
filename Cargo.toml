[workspace]
members = [
    "crates/gigatiff-core",
    "crates/gigatiff-desktop",
    "crates/gigatiff-server",
]
resolver = "3"
exclude = ["vendor/grokj2k-sys"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/bezverec/gigatiff"

[workspace.dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
clap = "4.6.1"
eframe = "0.34.3"
grokj2k-sys = { path = "vendor/grokj2k-sys" }
image = { version = "0.25.10", default-features = false }
lcms2 = "6.1.1"
openjpeg-sys = "1.0.12"
percent-encoding = "2.3.2"
png = "0.18.1"
rayon = "1.12.0"
redis = "1.2.2"
rfd = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.150"
tiff = "0.11.3"
tokio = "1.52.3"
tower-http = "0.6.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
