[workspace]
members = [
    "crates/gigatiff-core",
    "crates/gigatiff-desktop",
    "crates/gigatiff-server",
]
resolver = "3"
exclude = ["vendor/grokj2k-sys"]

[workspace.package]
version = "0.3.8"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/bezverec/gigatiff"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = "4.6.7"
eframe = "0.37.0"
grokj2k-sys = { path = "vendor/grokj2k-sys" }
image = { version = "0.25.10", default-features = false }
lcms2 = "6.2.0"
openjpeg-sys = "1.0.12"
percent-encoding = "2.3.2"
png = "0.18.1"
rayon = "1.12.0"
redis = "1.7.1"
rfd = "0.17.2"
serde = "1.0.229"
serde_json = "1.0.154"
tiff = "0.11.3"
tokio = "1.54.1"
tower-http = "0.7.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
