[package]
name = "gigatiff"
version = "0.2.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]
server = [
    "dep:axum",
    "dep:image",
    "dep:percent-encoding",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tower-http",
]
jpeg2000-grok = ["server"]
jpeg2000-grok-ffi = ["jpeg2000-grok", "dep:grokj2k-sys"]

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
eframe = { version = "0.34.3", optional = true }
grokj2k-sys = { path = "vendor/grokj2k-sys", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
lcms2 = "6.1.1"
percent-encoding = { version = "2.3.2", optional = true }
png = "0.18.1"
rayon = "1.12.0"
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
tiff = "0.11.3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync"], optional = true }
tower-http = { version = "0.6.11", features = ["cors", "trace"], optional = true }

[[bin]]
name = "gigatiff-server"
path = "src/bin/gigatiff-server.rs"
required-features = ["server"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
