[package]
name = "gigatiff-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[example]]
name = "bench-grok"
path = "examples/bench_grok.rs"
required-features = ["jpeg2000-grok-ffi"]

[features]
default = []
jpeg2000-grok-ffi = ["dep:grokj2k-sys"]
jpeg2000-openjpeg-ffi = ["dep:openjpeg-sys"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
grokj2k-sys = { workspace = true, optional = true }
lcms2.workspace = true
openjpeg-sys = { workspace = true, optional = true }
png.workspace = true
rayon.workspace = true
tiff.workspace = true
