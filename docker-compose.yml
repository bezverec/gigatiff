services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.30.3
    command:
      - --cache_mode=true
      - --maxmemory=2gb
      - --proactor_threads=4
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data

  gigatiff-server:
    build:
      context: .
      args:
        GIGATIFF_BUILD_GROK: ${GIGATIFF_BUILD_GROK:-1}
        GIGATIFF_SERVER_FEATURES: ${GIGATIFF_SERVER_FEATURES:-jpeg2000-grok-ffi}
    command:
      - --root
      - /data
      - --cache-dir
      - /cache
      - --cache-backend
      - dragonfly
      - --dragonfly-url
      - redis://dragonfly:6379/
      - --cache-namespace
      - gigatiff-server-response-v10
      - --cache-max-mb
      - "4096"
      - --max-concurrent-renders
      - "4"
      - --openjpeg-threads
      - "4"
      - --addr
      - 0.0.0.0:8080
    volumes:
      - ./images:/data:ro
      - ./cache:/cache
    depends_on:
      - dragonfly

  caddy:
    image: caddy:2.11.4
    depends_on:
      - gigatiff-server
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dragonfly_data:
  caddy_data:
  caddy_config:
