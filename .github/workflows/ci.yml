name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtiff-dev \
            liblcms2-dev \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libudev-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libtiff little-cms2 pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install tiff:x64-windows lcms:x64-windows
          "LIBTIFF_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check
        run: cargo check --locked

      - name: Check server-only build
        run: cargo check --bin gigatiff-server --no-default-features --features server --locked

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked --bins

  iiif-smoke:
    name: IIIF server smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtiff-dev \
            liblcms2-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test server-only build
        run: cargo test --locked --no-default-features --features server --lib --bin gigatiff-server

      - name: Generate IIIF smoke fixture
        shell: pwsh
        run: ./scripts/new-test-tiff.ps1 -OutPath images/ci-smoke.tif -Width 64 -Height 64

      - name: Start compose stack
        run: docker compose up -d --build

      - name: Wait for IIIF server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deadline = (Get-Date).AddMinutes(2)
          do {
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/images" | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 2
            }
          } while ((Get-Date) -lt $deadline)
          throw "IIIF server did not become ready before timeout."

      - name: Run IIIF smoke test
        shell: pwsh
        run: ./scripts/iiif-smoke.ps1 -BaseUrl http://127.0.0.1:18082 -ImageId ci-smoke.tif -RegionSize 32 -OutputSize 16

      - name: Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop compose stack
        if: always()
        run: docker compose down -v
