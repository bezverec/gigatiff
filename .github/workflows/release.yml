name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            package: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            package: linux-x64
          - name: macOS
            os: macos-latest
            package: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtiff-dev \
            liblcms2-dev \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libudev-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libtiff little-cms2 pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install tiff:x64-windows lcms:x64-windows
          "LIBTIFF_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --bins

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $packageName = "gigatiff-$version-${{ matrix.package }}"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target\release\gigatiff.exe" $packageDir
          Copy-Item "target\release\gigatiff-server.exe" $packageDir
          Copy-Item "README.md", "LICENSE" $packageDir
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin"
          Copy-Item (Join-Path $vcpkgBin "*.dll") $packageDir -ErrorAction SilentlyContinue
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\$packageName.zip" -Force

      - name: Package Unix ZIP archive
        if: runner.os != 'Windows'
        run: |
          version="${{ github.ref_name }}"
          version_clean="${version#v}"
          package_name="gigatiff-$version-${{ matrix.package }}"
          package_dir="dist/$package_name"
          mkdir -p "$package_dir"
          cp target/release/gigatiff "$package_dir/"
          cp target/release/gigatiff-server "$package_dir/"
          cp README.md LICENSE "$package_dir/"

          if [ "${{ runner.os }}" = "macOS" ]; then
            app_dir="$package_dir/GigaTIFF.app"
            mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"
            cp target/release/gigatiff "$app_dir/Contents/MacOS/GigaTIFF"
            chmod +x "$app_dir/Contents/MacOS/GigaTIFF"
            cat > "$app_dir/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>GigaTIFF</string>
            <key>CFBundleExecutable</key>
            <string>GigaTIFF</string>
            <key>CFBundleIdentifier</key>
            <string>cz.bezverec.gigatiff</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>GigaTIFF</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$version_clean</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          fi

          if [ "${{ runner.os }}" = "Linux" ]; then
            cat > "$package_dir/GigaTIFF.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=GigaTIFF
          Comment=Memory-conscious TIFF and BigTIFF viewer
          Exec=sh -c 'cd "$(dirname "$1")" && ./gigatiff' -- %k
          Terminal=false
          Categories=Graphics;Viewer;
          DESKTOP
            chmod +x "$package_dir/GigaTIFF.desktop"
          fi

          cd dist
          zip -r "$package_name.zip" "$package_name"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gigatiff-${{ github.ref_name }}-${{ matrix.package }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gigatiff-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Remove existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' |
              while read -r asset; do
                if [ -n "$asset" ]; then
                  gh release delete-asset "${{ github.ref_name }}" "$asset" -y
                fi
              done
          fi

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: GigaTIFF ${{ github.ref_name }}
          draft: false
          prerelease: true
          body: |
            First prerelease build of GigaTIFF.

            Included archives:

            - `gigatiff-${{ github.ref_name }}-windows-x64.zip` with `gigatiff.exe`, `gigatiff-server.exe`, and required vcpkg DLLs.
            - `gigatiff-${{ github.ref_name }}-linux-x64.zip` with the Linux desktop/server binaries and a `GigaTIFF.desktop` launcher.
            - `gigatiff-${{ github.ref_name }}-macos.zip` with the macOS desktop/server binaries and a `GigaTIFF.app` bundle for Finder launch.

            Source code archives are provided automatically by GitHub.
          files: dist/*.zip
